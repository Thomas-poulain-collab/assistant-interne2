<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assistant RH</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f7f6f3;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    #header {
      background: #fff;
      border-bottom: 1px solid #e8e7e3;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    #header h1 { font-size: 15px; font-weight: 600; color: #1a1a1a; }
    #header p { font-size: 12px; color: #9b9b9b; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; }
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .msg {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.6;
    }
    .msg.user {
      background: #2383e2;
      color: white;
      align-self: flex-end;
      border-radius: 12px 12px 2px 12px;
    }
    .msg.bot {
      background: #fff;
      color: #1a1a1a;
      align-self: flex-start;
      border: 1px solid #e8e7e3;
      border-radius: 12px 12px 12px 2px;
    }
    .msg.bot.loading { color: #9b9b9b; font-style: italic; }
    .msg.error { background: #fef2f2; color: #dc2626; border-color: #fecaca; }
    .sources {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid #f0f0f0;
      font-size: 12px;
      color: #9b9b9b;
    }
    .sources a { color: #2383e2; text-decoration: none; }
    .sources a:hover { text-decoration: underline; }
    #input-area {
      background: #fff;
      border-top: 1px solid #e8e7e3;
      padding: 12px 20px;
      display: flex;
      gap: 8px;
    }
    #input {
      flex: 1;
      border: 1px solid #e8e7e3;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 14px;
      outline: none;
      resize: none;
      height: 44px;
      line-height: 1.5;
      font-family: inherit;
    }
    #input:focus { border-color: #2383e2; }
    #send {
      background: #2383e2;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 0 16px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: background 0.15s;
    }
    #send:hover { background: #1a6ec7; }
    #send:disabled { background: #c4d9f0; cursor: not-allowed; }
    .welcome {
      text-align: center;
      padding: 40px 20px;
      color: #9b9b9b;
    }
    .welcome h2 { font-size: 18px; color: #1a1a1a; margin-bottom: 8px; }
    .welcome p { font-size: 14px; margin-bottom: 20px; }
    .suggestions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
    .suggestion {
      background: #fff;
      border: 1px solid #e8e7e3;
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 13px;
      cursor: pointer;
      color: #374151;
      transition: all 0.15s;
    }
    .suggestion:hover { border-color: #2383e2; color: #2383e2; }
  </style>
</head>
<body>
  <div id="header">
    <div class="dot"></div>
    <div>
      <h1>Assistant interne</h1>
      <p>Posez vos questions sur nos ressources</p>
    </div>
  </div>

  <div id="messages">
    <div class="welcome">
      <h2>Bonjour 👋</h2>
      <p>Je suis votre assistant interne. Je consulte directement nos ressources Notion pour vous répondre.</p>
      <div class="suggestions">
        <div class="suggestion" onclick="ask(this.textContent)">Congés et absences</div>
        <div class="suggestion" onclick="ask(this.textContent)">Convention collective</div>
        <div class="suggestion" onclick="ask(this.textContent)">Nos marques</div>
        <div class="suggestion" onclick="ask(this.textContent)">Procédures internes</div>
      </div>
    </div>
  </div>

  <div id="input-area">
    <textarea id="input" placeholder="Posez votre question…" rows="1"
      onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage()}"></textarea>
    <button id="send" onclick="sendMessage()">Envoyer</button>
  </div>

  <script>
    function ask(text) {
      document.getElementById('input').value = text;
      sendMessage();
    }

    async function sendMessage() {
      const input = document.getElementById('input');
      const text = input.value.trim();
      if (!text) return;

      const msgs = document.getElementById('messages');
      const welcome = msgs.querySelector('.welcome');
      if (welcome) welcome.remove();

      const userMsg = document.createElement('div');
      userMsg.className = 'msg user';
      userMsg.textContent = text;
      msgs.appendChild(userMsg);

      input.value = '';
      document.getElementById('send').disabled = true;

      const botMsg = document.createElement('div');
      botMsg.className = 'msg bot loading';
      botMsg.textContent = 'Recherche dans vos ressources Notion…';
      msgs.appendChild(botMsg);
      msgs.scrollTop = msgs.scrollHeight;

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ question: text })
        });
        const data = await res.json();
        if (data.error) throw new Error(data.error);

        botMsg.className = 'msg bot';
        botMsg.innerHTML = data.answer.replace(/\n/g, '<br>');

        if (data.sources && data.sources.length > 0) {
          const srcDiv = document.createElement('div');
          srcDiv.className = 'sources';
          srcDiv.innerHTML = '📄 Sources : ' + data.sources.map(s =>
            `<a href="${s.url}" target="_blank">${s.title}</a>`
          ).join(', ');
          botMsg.appendChild(srcDiv);
        }
      } catch (err) {
        botMsg.className = 'msg bot error';
        botMsg.textContent = 'Erreur : ' + err.message;
      }

      document.getElementById('send').disabled = false;
      msgs.scrollTop = msgs.scrollHeight;
    }
  </script>
</body>
</html>
