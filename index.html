<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assistant interne</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f7f6f3;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    #header {
      background: #fff;
      border-bottom: 1px solid #e8e7e3;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    #header-left { display: flex; align-items: center; gap: 10px; }
    #header h1 { font-size: 15px; font-weight: 600; color: #1a1a1a; }
    #header p { font-size: 12px; color: #9b9b9b; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; }
    #admin-btn {
      display: none;
      background: #f3f4f6;
      border: 1px solid #e8e7e3;
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 12px;
      cursor: pointer;
      color: #374151;
    }
    #admin-panel {
      display: none;
      background: #fff;
      border-bottom: 1px solid #e8e7e3;
      padding: 12px 20px;
      gap: 12px;
      align-items: center;
    }
    #admin-panel button {
      background: #2383e2;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 8px 16px;
      font-size: 13px;
      cursor: pointer;
    }
    #admin-panel button:disabled { background: #c4d9f0; cursor: not-allowed; }
    #admin-log { font-size: 12px; color: #555; font-family: monospace; }
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .msg {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.6;
    }
    .msg.user {
      background: #2383e2;
      color: white;
      align-self: flex-end;
      border-radius: 12px 12px 2px 12px;
    }
    .msg.bot {
      background: #fff;
      color: #1a1a1a;
      align-self: flex-start;
      border: 1px solid #e8e7e3;
      border-radius: 12px 12px 12px 2px;
    }
    .msg.bot.loading { color: #9b9b9b; font-style: italic; }
    .msg.error { background: #fef2f2; color: #dc2626; border-color: #fecaca; }
    .welcome {
      text-align: center;
      padding: 40px 20px;
      color: #9b9b9b;
    }
    .welcome h2 { font-size: 18px; color: #1a1a1a; margin-bottom: 8px; }
    .welcome p { font-size: 14px; }
    #input-area {
      background: #fff;
      border-top: 1px solid #e8e7e3;
      padding: 12px 20px;
      display: flex;
      gap: 8px;
    }
    #input {
      flex: 1;
      border: 1px solid #e8e7e3;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 14px;
      outline: none;
      resize: none;
      height: 44px;
      line-height: 1.5;
      font-family: inherit;
    }
    #input:focus { border-color: #2383e2; }
    #send {
      background: #2383e2;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 0 16px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
    }
    #send:disabled { background: #c4d9f0; cursor: not-allowed; }
  </style>
</head>
<body>
  <div id="header">
    <div id="header-left">
      <div class="dot"></div>
      <div>
        <h1>Assistant interne</h1>
        <p>Posez vos questions sur nos ressources</p>
      </div>
    </div>
    <button id="admin-btn" onclick="toggleAdmin()">⚙️ Admin</button>
  </div>

  <div id="admin-panel">
    <button id="index-btn" onclick="startIndexing()">🔄 Lancer l'indexation</button>
    <span id="admin-log">Cliquez pour indexer toutes les ressources Notion.</span>
  </div>

  <div id="messages">
    <div class="welcome">
      <h2>Bonjour 👋</h2>
      <p>Je suis votre assistant interne. Posez-moi n'importe quelle question sur nos ressources.</p>
    </div>
  </div>

  <div id="input-area">
    <textarea id="input" placeholder="Posez votre question…" rows="1"
      onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage()}"></textarea>
    <button id="send" onclick="sendMessage()">Envoyer</button>
  </div>

  <script>
    const KEY = 'reindex2024';

    // Affiche le panneau admin si ?admin dans l'URL
    if (window.location.search.includes('admin')) {
      document.getElementById('admin-btn').style.display = 'block';
      document.getElementById('admin-panel').style.display = 'flex';
    }

    function toggleAdmin() {
      const panel = document.getElementById('admin-panel');
      panel.style.display = panel.style.display === 'none' ? 'flex' : 'none';
    }

    async function startIndexing() {
      const btn = document.getElementById('index-btn');
      const log = document.getElementById('admin-log');
      btn.disabled = true;

      let url = `/api/reindex?key=${KEY}`;
      let total = 0;

      while (url) {
        try {
          const res = await fetch(url);
          const data = await res.json();

          if (data.status === 'done') {
            log.textContent = `✅ Terminé ! ${data.total} entrées indexées.`;
            btn.disabled = false;
            url = null;
          } else if (data.status === 'continue') {
            total = data.total;
            log.textContent = `⏳ ${total} entrées traitées...`;
            url = data.nextUrl;
            await new Promise(r => setTimeout(r, 300));
          } else {
            log.textContent = `❌ Erreur : ${data.error}`;
            btn.disabled = false;
            url = null;
          }
        } catch (err) {
          log.textContent = `❌ Erreur : ${err.message}`;
          btn.disabled = false;
          url = null;
        }
      }
    }

    async function sendMessage() {
      const input = document.getElementById('input');
      const text = input.value.trim();
      if (!text) return;

      const msgs = document.getElementById('messages');
      const welcome = msgs.querySelector('.welcome');
      if (welcome) welcome.remove();

      const userMsg = document.createElement('div');
      userMsg.className = 'msg user';
      userMsg.textContent = text;
      msgs.appendChild(userMsg);

      input.value = '';
      document.getElementById('send').disabled = true;

      const botMsg = document.createElement('div');
      botMsg.className = 'msg bot loading';
      botMsg.textContent = 'Recherche dans vos ressources Notion…';
      msgs.appendChild(botMsg);
      msgs.scrollTop = msgs.scrollHeight;

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ question: text })
        });
        const data = await res.json();
        if (data.error) throw new Error(data.error);

        botMsg.className = 'msg bot';
        botMsg.innerHTML = data.answer.replace(/\n/g, '<br>');
      } catch (err) {
        botMsg.className = 'msg bot error';
        botMsg.textContent = 'Erreur : ' + err.message;
      }

      document.getElementById('send').disabled = false;
      msgs.scrollTop = msgs.scrollHeight;
    }
  </script>
</body>
</html>
